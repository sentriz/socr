name: Nightly Release
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
jobs:
  check-date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          test -n "$(git rev-list --after="24 hours" ${{ github.sha }})" \
            && echo "should_run=true" >>$GITHUB_OUTPUT \
            || echo "should_run=false" >>$GITHUB_OUTPUT
  test-frontend:
    name: Lint and test frontend
    needs: check-date
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 19
      - name: Install dependencies
        run: npm install
        working-directory: web
      - name: Check types
        run: npm run check-types
        working-directory: web
      - name: Check formatting
        run: npm run check-formatting
        working-directory: web
  test-backend:
    name: Lint and test backend
    needs: check-date
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq tesseract-ocr
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.12.2
      - name: Test
        run: go test -race ./...
  build-docker:
    name: Build and release Docker image
    needs: [check-date, test-frontend, test-backend]
    if: ${{ needs.check-date.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login into DockerHub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      - name: Login into GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Generate short hash
        run: |
          _short_hash=${{ github.sha }}
          echo "SHORT_HASH=${_short_hash:0:7}" >> $GITHUB_ENV
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.SHORT_HASH }}
            ghcr.io/${{ github.repository }}:nightly
            ${{ github.repository }}:${{ env.SHORT_HASH }}
            ${{ github.repository }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
