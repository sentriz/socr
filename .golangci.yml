version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocritic
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - ineffassign
    - interfacebloat
    - intrange
    - loggercheck
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    staticcheck:
      checks:
        - all
        - "-QF1008"
        - "-ST1000"
    gocritic:
      disabled-checks:
        - unlambda
        - appendAssign
    gosec:
      excludes:
        - G104 # errors unhandled
        - G115 # integer overflow conversion
        - G704 # SSRF via taint analysis - HTTP clients hit user-configured endpoints
        - G705 # XSS via taint analysis - we don't render untrusted strings as HTML
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - os.Setenv
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*net/http.ResponseController).Flush
        - (*bufio.Writer).Flush
        - (*flag.FlagSet).Parse # have flag.ExitOnError
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - goconst
formatters:
  enable:
    - gofmt
    - goimports
